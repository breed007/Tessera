<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Tessera app icon master — "address-block map".
       Full-bleed 1024 square (macOS / Scripts/render-appicon.swift applies the squircle mask).
       Suite palette: ground #0f1310, accent #3ad17a, dim #2f7a4d. -->
  <rect width="1024" height="1024" fill="#0f1310"/>

  <!-- range ticks (shared recon scope cue) -->
  <g stroke="#2f7a4d" stroke-width="12" stroke-linecap="round">
    <line x1="512" y1="103" x2="512" y2="61"/>
    <line x1="512" y1="921" x2="512" y2="963"/>
    <line x1="103" y1="512" x2="61" y2="512"/>
    <line x1="921" y1="512" x2="963" y2="512"/>
  </g>

  <!-- free / unobserved parcels (dim outline) -->
  <g fill="none" stroke="#2f7a4d" stroke-width="12">
    <rect x="648" y="202" width="173" height="173" rx="30"/>
    <rect x="202" y="425" width="173" height="173" rx="30"/>
    <rect x="648" y="425" width="173" height="173" rx="30"/>
    <rect x="202" y="648" width="173" height="173" rx="30"/>
    <rect x="425" y="648" width="173" height="173" rx="30"/>
  </g>

  <!-- allocated / discovered parcels (filled accent) -->
  <g fill="#3ad17a">
    <rect x="202" y="202" width="173" height="173" rx="30"/>
    <rect x="425" y="202" width="173" height="173" rx="30"/>
    <rect x="648" y="648" width="173" height="173" rx="30"/>
  </g>

  <!-- center parcel: the live discovery — dim frame holding the suite's device-core square -->
  <rect x="425" y="425" width="173" height="173" rx="30" fill="none" stroke="#2f7a4d" stroke-width="12"/>
  <rect x="466" y="466" width="92" height="92" rx="15" fill="#3ad17a"/>
</svg>
